<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Riddhima</title>
    <style>
        body {
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 20px; }
        
        .photo-slot {
            width: 200px;
            height: 200px;
            background: #f0f0f0;
            margin: 0 auto 20px;
            border-radius: 15px;
            border: 5px solid #ff85a2;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* TIP: Replace the URL below with an actual photo of Riddhima */
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #adb5bd; color: white; position: relative; }

        .floating-hearts {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 3s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="photo-slot">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_6uYpM8-sI9pP3v8w15y5fL_7T6S4w5mHZw&s" alt="Beautiful Riddhima">
        </div>
        <h1 id="question">Riddhima, will you be my Valentine? ❤️</h1>
        <p id="message" style="color: #ff4d6d; font-weight: bold;"></p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="changeText()">No</button>
        </div>
    </div>

    <script>
        const noTexts = [
            "Please love ap nhi to kon?",
            "Whos my jaan? 🥺",
            "I love uh naaa...",
            "Dekho apan ekdusre ko maut tak jante h!",
            "Apkooooo SRK ki kasam maan jao na! 🤴"
        ];
        let textIndex = 0;

        function moveButton() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            document.getElementById('noBtn').style.position = 'absolute';
            document.getElementById('noBtn').style.left = x + 'px';
            document.getElementById('noBtn').style.top = y + 'px';
        }

        function changeText() {
            document.getElementById('message').innerText = noTexts[textIndex];
            textIndex = (textIndex + 1) % noTexts.length;
            
            // Make the Yes button grow every time she clicks No!
            let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            document.getElementById('yesBtn').style.fontSize = (currentSize + 5) + "px";
            document.getElementById('yesBtn').style.padding = (currentSize + 2) + "px";
        }

        function celebrate() {
            document.querySelector('.container').innerHTML = `
                <h1 style="font-size: 3rem;">YAYYY! ❤️</h1>
                <p>I love you Riddhima! You've made me the happiest person!</p>
                <div style="font-size: 50px;">👩‍❤️‍👨✨</div>
            `;
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-hearts');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
