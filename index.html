<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    width: 320px;
    position: relative;
    z-index: 2;
  }

  h2 {
    margin-bottom: 25px;
  }

  button {
    padding: 10px 22px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
  }

  #noBtn {
    background: #999;
    color: white;
    position: absolute;
    left: 55%;
    top: 65%;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) scale(1.8);
      opacity: 0;
    }
  }

  /* Popup */
  .popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 3;
  }

  .popup-content {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    width: 300px;
  }
</style>
</head>

<body>

<!-- Romantic music -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2023/03/06/audio_2b0c9b62c0.mp3" type="audio/mpeg">
</audio>

<div class="box">
  <h2>Riddhima 💕<br>Will you be my Valentine?</h2>
  <button id="yesBtn" onclick="yesClicked()">Yes 😍</button>
  <button id="noBtn" onclick="noClicked()">No 🙈</button>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <p id="popupText"></p>
    <button onclick="closePopup()">Okay 🥹</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");
const music = document.getElementById("bgMusic");

const messages = [
  "Love… aap nahi toh kaun? 🥺❤️",
  "Who’s my jaan agar aap nahi? 😭",
  "I love you naaa 🫶",
  "Dekho apan ek-dusre ko ab maut tak jaante hain 💍",
  "Aapko SRK ki kasam… maan jao na 🥹✨"
];

let index = 0;
let musicPlayed = false;

function noClicked() {
  if (!musicPlayed) {
    music.play();
    musicPlayed = true;
  }

  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = translate(${x}px, ${y}px);

  popupText.innerText = messages[index % messages.length];
  index++;

  popup.style.display = "flex";
}

function closePopup() {
  popup.style.display = "none";
}

function yesClicked() {
  music.play();
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff4d6d,#ff8fab);
      color:white;
      text-align:center;
      font-size:26px;
      padding:20px;
    ">
      💖 Yayyyy 💖<br><br>
      I knew it 🥹✨<br>
      Happy Valentine’s Day ❤️
    </div>
  `;
}

// Hearts animation
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 7000);
}, 500);
</script>

</body>
</html>
