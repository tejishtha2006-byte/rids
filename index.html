<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Riddhima</title>
    <style>
        body {
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 20px; }
        
        .photo-slot {
            width: 200px;
            height: 200px;
            background: #f0f0f0;
            margin: 0 auto 20px;
            border-radius: 15px;
            border: 5px solid #ff85a2;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* TIP: Replace the URL below with an actual photo of Riddhima */
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #adb5bd; color: white; position: relative; }

        .floating-hearts {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 3s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="photo-slot">
            <img src="riddhima.jpg">
        </div>
        <h1 id="question">Riddhima, will you be my Valentine? ❤️</h1>
        <p id="msg" style="
margin-top:15px;
font-size:18px;
font-weight:bold;
background:rgba(255,255,255,0.2);
padding:10px 15px;
border-radius:15px;
min-height:40px;
"></p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="changeText()">No</button>
        </div>
    </div>
<script>
const messages = [
  "Please love, aap nahi to kaun? 🥺",
  "Who’s my jaan? 💖",
  "I love you naaa 😘",
  "Dekho apan ek dusre ko ab maut tak jaante hai 🫶",
  "Aapko SRK ki kasam, maan jao na 🥹❤️"
];

let textIndex = 0;

function move() {
  const noBtn = document.getElementById("no");
  const msg = document.getElementById("msg");

  noBtn.style.left = Math.random() * 80 + "vw";
  noBtn.style.top  = Math.random() * 80 + "vh";

  msg.innerText = messages[textIndex];
  textIndex = (textIndex + 1) % messages.length;
}

function yes() {
  document.body.innerHTML = `
    <h1 style="color:white;text-align:center;margin-top:40vh;">
      YAYYYY 💖💖💖<br>
      I knew it 😘<br>
      Happy Valentine’s Day ❤️
    </h1>
  `;
}
</script>
